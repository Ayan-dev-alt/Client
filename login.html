<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070707;
      --card: #101010;
      --card2: #151515;
      --text: #ffffff;
      --muted: #a5a5a5;
      --border: #292929;
      --gold: #d5ad55;
      --gold-dark: #b58d35;
      --input: #151515;
      --danger: #e05252;
    }

    body.light {
      --bg: #f7f7f7;
      --card: #ffffff;
      --card2: #f1f1f1;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
      --gold: #b7892e;
      --gold-dark: #966d20;
      --input: #ffffff;
      --danger: #d33d3d;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: 0.3s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font-family: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      max-width: 1450px;
      min-height: 75px;
      margin: auto;
      padding: 0 25px;

      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 230px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;

      background: var(--gold);
      color: #111;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 800;
      font-size: 17px;
    }

    .logo-text {
      line-height: 1.05;
    }

    .logo-text strong {
      display: block;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .logo-text span {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold);
    }

    .nav-right {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 15px;

      white-space: nowrap;
    }

    .nav-link {
      color: var(--muted);
      font-size: 14px;
      transition: 0.2s;
    }

    .nav-link:hover {
      color: var(--gold);
    }

    .separator {
      width: 1px;
      height: 25px;
      background: var(--border);
    }

    .theme-btn {
      width: 38px;
      height: 38px;

      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);

      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
    }

    .theme-btn:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    main {
      min-height: calc(100vh - 75px);

      display: flex;
      flex-direction: column;
    }

    .breadcrumb {
      width: 100%;
      max-width: 1450px;
      margin: auto;
      padding: 25px;

      color: var(--muted);
      font-size: 13px;
    }

    .breadcrumb a:hover {
      color: var(--gold);
    }

    .login-section {
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 20px 90px;
    }

    .login-container {
      width: 100%;
      max-width: 470px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 14px;

      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-icon {
      width: 62px;
      height: 62px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: var(--card2);
      border: 1px solid var(--border);

      color: var(--gold);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;
    }

    .login-header h1 {
      font-family: "Playfair Display", serif;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-group label {
      display: block;

      font-size: 13px;
      font-weight: 600;

      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap > i {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--muted);
      font-size: 14px;
    }

    .input-wrap input {
      width: 100%;
      height: 46px;

      background: var(--input);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 7px;

      outline: none;

      padding: 0 45px;
      font-size: 13px;

      transition: 0.2s;
    }

    .input-wrap input:focus {
      border-color: var(--gold);
    }

    .input-wrap input::placeholder {
      color: var(--muted);
    }

    .password-toggle {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: var(--muted);

      cursor: pointer;
      font-size: 14px;
    }

    .password-toggle:hover {
      color: var(--gold);
    }

    .form-options {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 22px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;

      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .remember input {
      accent-color: var(--gold);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--gold);
      font-size: 12px;
      transition: 0.2s;
    }

    .forgot-link:hover {
      color: var(--gold-dark);
    }

    .login-btn {
      width: 100%;
      height: 48px;

      border: none;
      border-radius: 7px;

      background: var(--gold);
      color: #111;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      transition: 0.2s;
    }

    .login-btn:hover {
      background: var(--gold-dark);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .form-message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 7px;

      font-size: 12px;
      line-height: 1.5;

      text-align: center;
    }

    .form-message.error {
      display: block;

      background: rgba(224, 82, 82, 0.10);
      border: 1px solid var(--danger);

      color: var(--danger);
    }

    .form-message.success {
      display: block;

      background: rgba(213, 173, 85, 0.10);
      border: 1px solid var(--gold);

      color: var(--gold);
    }

    .register-text {
      margin-top: 25px;
      padding-top: 23px;

      border-top: 1px solid var(--border);

      text-align: center;

      color: var(--muted);
      font-size: 13px;
    }

    .register-text a {
      color: var(--gold);
      font-weight: 600;
      transition: 0.2s;
    }

    .register-text a:hover {
      color: var(--gold-dark);
    }
.copyright {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

  <script>

    /* =========================
       THEME
    ========================= */

    const themeBtn =
      document.getElementById("themeBtn");

    const themeIcon =
      document.getElementById("themeIcon");


    function applyTheme() {

      const savedTheme =
        localStorage.getItem("theme");


      if (savedTheme === "light") {

        document.body.classList.add("light");

        themeIcon.classList.remove("fa-moon");

        themeIcon.classList.add("fa-sun");

      } else {

        document.body.classList.remove("light");

        themeIcon.classList.remove("fa-sun");

        themeIcon.classList.add("fa-moon");

      }

    }


    themeBtn.addEventListener(
      "click",
      function () {

        document.body.classList.toggle("light");


        if (
          document.body.classList.contains("light")
        ) {

          localStorage.setItem(
            "theme",
            "light"
          );

          themeIcon.classList.remove("fa-moon");

          themeIcon.classList.add("fa-sun");

        } else {

          localStorage.setItem(
            "theme",
            "dark"
          );

          themeIcon.classList.remove("fa-sun");

          themeIcon.classList.add("fa-moon");

        }

      }
    );


    applyTheme();


    /* =========================
       PASSWORD SHOW / HIDE
    ========================= */

    const passwordInput =
      document.getElementById("password");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const passwordIcon =
      document.getElementById("passwordIcon");


    passwordToggle.addEventListener(
      "click",
      function () {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          passwordIcon.classList.remove(
            "fa-eye"
          );

          passwordIcon.classList.add(
            "fa-eye-slash"
          );

          passwordToggle.title =
            "Hide Password";

        } else {

          passwordInput.type =
            "password";

          passwordIcon.classList.remove(
            "fa-eye-slash"
          );

          passwordIcon.classList.add(
            "fa-eye"
          );

          passwordToggle.title =
            "Show Password";

        }

      }
    );


    /* =========================
       LOGIN
    ========================= */

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginBtnText =
      document.getElementById("loginBtnText");

    const loginIcon =
      document.getElementById("loginIcon");

    const formMessage =
      document.getElementById("formMessage");


    loginForm.addEventListener(
      "submit",
      async function (e) {

        e.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =
          document.getElementById("password").value;


        const remember =
          document.getElementById("remember").checked;


        /* Basic validation */

        if (!email || !password) {

          formMessage.className =
            "form-message error";

          formMessage.textContent =
            "Please enter your email and password.";

          return;

        }


        /* Loading */

        loginBtn.disabled = true;

        loginBtnText.textContent =
          "Logging in...";

        loginIcon.className =
          "fa-solid fa-spinner fa-spin";

        formMessage.className =
          "form-message";

        formMessage.textContent = "";


        try {

          /* Backend Login API */

          const response =
            await fetch(
              "http://localhost:5000/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                })
              }
            );


          const data =
            await response.json();


          /* Backend error */

          if (!response.ok || !data.success) {

            formMessage.className =
              "form-message error";

            formMessage.textContent =
              data.message ||
              "Invalid email or password.";

            loginBtn.disabled = false;

            loginBtnText.textContent =
              "Login";

            loginIcon.className =
              "fa-solid fa-right-to-bracket";

            return;

          }


          /* =========================
             SAVE LOGIN DATA
          ========================= */

          localStorage.setItem(
            "userLoggedIn",
            "true"
          );


          /* JWT TOKEN */

          localStorage.setItem(
            "token",
            data.token
          );


          /* Safe user information */

          localStorage.setItem(
            "currentUser",
            JSON.stringify({
              id: data.user.id,
              name: data.user.name,
              email: data.user.email,
              phone: data.user.phone || "",
              address: data.user.address || ""
            })
          );


          /* Remember me */

          if (remember) {

            localStorage.setItem(
              "rememberLogin",
              "true"
            );

          } else {

            localStorage.removeItem(
              "rememberLogin"
            );

          }


          /* Success message */

          formMessage.className =
            "form-message success";

          formMessage.textContent =
            "Login successful! Redirecting...";


          /* Redirect */

          const redirect =
            localStorage.getItem(
              "redirectAfterLogin"
            );


          setTimeout(
            function () {

              if (redirect) {

                localStorage.removeItem(
                  "redirectAfterLogin"
                );

                window.location.href =
                  redirect;

              } else {

                window.location.href =
                  "index.html";

              }

            },
            900
          );


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          formMessage.className =
            "form-message error";

          formMessage.textContent =
            "Unable to connect to the backend. Make sure the backend server is running.";


          loginBtn.disabled = false;

          loginBtnText.textContent =
            "Login";

          loginIcon.className =
            "fa-solid fa-right-to-bracket";

        }

      }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        function (e) {

          e.preventDefault();

          alert(
            "Password recovery will be connected with the backend later."
          );

        }
      );

  </script>

</body>
</html>
